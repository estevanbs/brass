<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brass: Birmingham</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Brass: Birmingham</h1>
      <div id="setup" class="setup">
        <label>Jogadores <select id="playerCount">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select></label>
        <label>Seed <input id="seed" type="number" placeholder="aleatória" /></label>
        <button id="newGameBtn">Novo jogo</button>
        <span id="statusMsg" class="status"></span>
      </div>
    </header>

    <main id="app" hidden>
      <div id="topStrip" class="top-strip"></div>

      <div id="stage" class="stage">
        <svg id="map" class="map-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="mapLegend" class="map-legend"></div>
        <div id="mapHint" class="map-hint" hidden></div>
        <div id="mapPopup" class="map-popup" hidden></div>
      </div>

      <div id="logDock" class="log-dock">
        <button id="logToggleBtn" class="log-toggle">📜 registro</button>
        <div id="log" class="log" hidden></div>
      </div>

      <div id="matDock" class="mat-dock">
        <button id="matToggleBtn" class="mat-toggle">🗂 tabuleiros</button>
        <div id="matPanel" class="mat-panel" hidden>
          <div id="matTabs" class="mat-tabs"></div>
          <div id="matStock" class="mat-stock"></div>
        </div>
      </div>

      <div id="handDock" class="hand-dock">
        <div id="otherActions" class="other-actions"></div>
        <div id="hand" class="hand-cards"></div>
      </div>
    </main>

    <div id="gameOverOverlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2>Fim de jogo</h2>
        <div id="scoreboard"></div>
        <button id="playAgainBtn">Jogar de novo</button>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
